<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Sensus Kelompok Marsela</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<div class="container">
  <div class="card">
    <h2>DATA SENSUS KELOMPOK MARSELA</h2>
    
    <!-- 📊 STATISTICS -->
    <div class="stats-grid" id="stats"></div>
    
    <!-- 🔍 SEARCH & FILTERS -->
    <div class="search-container">
      <input type="text" id="search" placeholder="🔍 Cari nama....">
      <span class="search-icon">🔍</span>
      <span class="clear-icon" id="clear" title="Clear">✕</span>
    </div>
    
    <div class="filters">
      <div class="filter-group">
        <label>Filter Kelamin</label>
        <select id="filterKelamin">
          <option value="">Semua</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Filter Kategori</label>
        <select id="filterKategori">
          <option value="">Semua</option>
        </select>
      </div>
    </div>
    
    <!-- 📋 TABLE -->
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Nama Lengkap</th>
          <th>Kelamin</th>
          <th>Tgl Lahir</th>
          <th>Umur</th>
          <th>Kategori</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="hasil"></tbody>
    </table>
  </div>
</div>

<script>

let data = [];
let filteredData = [];
let isLoaded = false;
let kkIndex = {};
let allKategori = new Set();
let allStatus = new Set();

const input = document.getElementById("search");
const clearBtn = document.getElementById("clear");

// Pasang event listener untuk pencarian realtime dengan debounce 300ms
input.addEventListener('input', debounce(applyFilters, 300));

// Event listener untuk tombol clear (menghapus input dan filter)
clearBtn.addEventListener('click', () => {
  input.value = '';
  document.querySelectorAll('.filter-group select').forEach(el => el.value = '');
  applyFilters();
});

// Mengambil data dari file data.json
fetch('data.json')
  .then(response => {
    if (!response.ok) {
      throw new Error('Gagal memuat file JSON');
    }
    return response.json();
  })
  .then(jsonData => {
    // Masukkan data dari JSON ke dalam variabel global 'data'
    data = jsonData.sort((a, b) => a.nama.localeCompare(b.nama)); 
    isLoaded = true;

    // Jalankan fungsi inisialisasi SETELAH data berhasil dimuat
    preprocessData();
    populateFilters();
    tampilSemua();
    
    // Perbarui statistik berdasarkan data yang baru dimuat
    if(typeof updateStatsFiltered === "function") {
      updateStatsFiltered(data);
    } else {
      updateStats();
    }
  })
  .catch(error => {
    console.error('Error:', error);
    document.getElementById('hasil').innerHTML = '<tr><td colspan="7" class="no-data">⚠️ Gagal memuat data. Pastikan buka lewat Live Server.</td></tr>';
  });

// ⚡ PREPROCESSING DATA
function preprocessData() {
  kkIndex = {};
  allKategori.clear();

  data.forEach(d => {
    if (!kkIndex[d.kk]) kkIndex[d.kk] = [];
    kkIndex[d.kk].push(d);

    allKategori.add(d.kategori);  // dari 'kategori' bukan 'status'
  });
}

// 📊 UPDATE STATISTICS (DEFAULT)
function updateStats() {
  const total = data.length;

  const cleanedData = data.map(d => ({
    ...d,
    kelamin: d.kelamin?.trim().toUpperCase(),
    kk: d.kk?.trim().toLowerCase()
  }));

  const laki = cleanedData.filter(d => d.kelamin === 'L').length;
  const perempuan = cleanedData.filter(d => d.kelamin === 'P').length;

  const kepalaKeluargaUnique = new Set(
    cleanedData.filter(d => d.status === 'Kepala Keluarga')
               .map(d => d.nama.toLowerCase())
  );
  const kkCount = kepalaKeluargaUnique.size;

  // Update statistik
  document.getElementById('stats').innerHTML = `
    <div class="stat-card">Total: ${total}</div>
    <div class="stat-card">Laki-laki: ${laki}</div>
    <div class="stat-card">Perempuan: ${perempuan}</div>
    <div class="stat-card">KK: ${kkCount}</div>
  `;
}

// 🎛️ POPULATE FILTERS
function populateFilters() {
  const katSelect = document.getElementById('filterKategori');
  
  // Clear previous options
  katSelect.innerHTML = '<option value="">Semua</option>';

  // Add new options for kategori
  Array.from(allKategori).sort().forEach(kat => {
    katSelect.innerHTML += `<option value="${kat}">${kat}</option>`;
  });
}

// 🔍 MASTER SEARCH & FILTER
function applyFilters() {
  let results = [...data];

  const keyword = input.value.toLowerCase().trim();
  if (keyword) {
    results = results.filter(d => {
      const nama = d.nama ? d.nama.toLowerCase().trim() : "";
      return nama.includes(keyword);
    });
  }

  const kelaminFilter = document.getElementById('filterKelamin').value;
  let kelaminVal = '';
  if (kelaminFilter === "Laki-laki") kelaminVal = "L";
  else if (kelaminFilter === "Perempuan") kelaminVal = "P";

  const kategoriFilter = document.getElementById('filterKategori').value;

  results = results.filter(d => {
    const kategoriOk = !kategoriFilter || d.kategori === kategoriFilter;
    const kelaminOk = !kelaminVal || d.kelamin === kelaminVal;
    return kategoriOk && kelaminOk;
  });

  filteredData = results;
  renderTable(results);
  updateStatsFiltered(results);
}

// ⚡ RENDER TABLE
function renderTable(dataList) {
  if (!dataList.length) {
    hasil.innerHTML = '<tr><td colspan="7" class="no-data">📭 Data tidak ditemukan</td></tr>';
    return;
  }
const sortedList = [...dataList].sort((a,b) => a.nama.localeCompare(b.nama))
  let html = '';
  sortedList.forEach((d,i) => {
    const umur = hitungUmur(d.tgl_lahir);
    html += `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${d.nama || '-'}</strong></td>
        <td>${d.kelamin || '-'}</td>
        <td>${d.tgl_lahir || '-'}</td>
        <td>${umur}</td>
        <td>${d.kategori || '-'}</td>
        <td>${d.status || '-'}</td>
      </tr>
    `;
  });

  hasil.innerHTML = html;
}

// 📊 STATS FILTERED
function updateStatsFiltered(dataList) {
  const stats = document.getElementById('stats');

  const filteredTotal = dataList.length;
  const filteredLaki = dataList.filter(d => d.kelamin === 'L').length;
  const filteredPerempuan = dataList.filter(d => d.kelamin === 'P').length;

  const total = data.length;
  const totalLaki = data.filter(d => d.kelamin === 'L').length;
  const totalPerempuan = data.filter(d => d.kelamin === 'P').length;

  const kepalaKeluargaUniqueFiltered = new Set(
    dataList.filter(d => d.status.toLowerCase() === 'kepala keluarga').map(d => d.nama.toLowerCase())
  );
  const filteredKK = kepalaKeluargaUniqueFiltered.size;

  const kepalaKeluargaUniqueTotal = new Set(
    data.filter(d => d.status.toLowerCase() === 'kepala keluarga').map(d => d.nama.toLowerCase())
  );
  const totalKK = kepalaKeluargaUniqueTotal.size;

  stats.innerHTML = `
    <div class="stat-card">Total: ${filteredTotal} / ${total}</div>
    <div class="stat-card">Laki-laki: ${filteredLaki} / ${totalLaki}</div>
    <div class="stat-card">Perempuan: ${filteredPerempuan} / ${totalPerempuan}</div>
    <div class="stat-card">KK: ${filteredKK} / ${totalKK}</div>
  `;
}

// 📋 SHOW ALL
function tampilSemua() {
  renderTable(data);
}

// 🔥 HITUNG UMUR
function hitungUmur(tgl) {
  if (!tgl) return '-';
  const lahir = new Date(tgl);
  if (isNaN(lahir)) return '-';
  
  const today = new Date();
  let umur = today.getFullYear() - lahir.getFullYear();
  const m = today.getMonth() - lahir.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < lahir.getDate())) {
    umur--;
  }
  return umur;
}

// 🎨 EVENT LISTENERS
['filterKelamin', 'filterKategori'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('change', applyFilters);
});

// 🛠️ UTILITIES
function debounce(func, wait) {
  let timeout;
  return function (...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}
</script>

</body>
</html>
