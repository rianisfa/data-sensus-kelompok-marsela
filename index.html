  const kepalaKeluargaUnique = new Set(
    cleanedData.filter(d => d.status === 'Kepala Keluarga')
               .map(d => d.nama.toLowerCase())
  );
  const kkCount = kepalaKeluargaUnique.size;

  // Update statistik
  document.getElementById('stats').innerHTML = `
    <div class="stat-card">👥 Total: ${total}</div>
    <div class="stat-card">♂️ Laki-laki: ${laki}</div>
    <div class="stat-card">♀️ Perempuan: ${perempuan}</div>
    <div class="stat-card">🏠 KK: ${kkCount}</div>
  `;
}

// 🎛️ POPULATE FILTERS
function populateFilters() {
  const katSelect = document.getElementById('filterKategori');
  
  // Clear previous options
  katSelect.innerHTML = '<option value="">Semua</option>';

  // Add new options for kategori
  Array.from(allKategori).sort().forEach(kat => {
    katSelect.innerHTML += `<option value="${kat}">${kat}</option>`;
  });
}

// 🔍 MASTER SEARCH & FILTER
function applyFilters() {
  let results = [...data];

  const keyword = input.value.toLowerCase().trim();
  if (keyword) {
    results = results.filter(d => {
      const nama = d.nama ? d.nama.toLowerCase().trim() : "";
      return nama.includes(keyword);
    });
  }

  const kelaminFilter = document.getElementById('filterKelamin').value;
  let kelaminVal = '';
  if (kelaminFilter === "Laki-laki") kelaminVal = "L";
  else if (kelaminFilter === "Perempuan") kelaminVal = "P";

  const kategoriFilter = document.getElementById('filterKategori').value;

  results = results.filter(d => {
    const kategoriOk = !kategoriFilter || d.kategori === kategoriFilter;
    const kelaminOk = !kelaminVal || d.kelamin === kelaminVal;
    return kategoriOk && kelaminOk;
  });

  filteredData = results;
  renderTable(results);
  updateStatsFiltered(results);
}

// ⚡ RENDER TABLE
function renderTable(dataList) {
  if (!dataList.length) {
    hasil.innerHTML = '<tr><td colspan="7" class="no-data">📭 Data tidak ditemukan</td></tr>';
    return;
  }

  let html = '';
  dataList.forEach((d, i) => {
    const umur = hitungUmur(d.tgl_lahir);
    html += `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${d.nama || '-'}</strong></td>
        <td>${d.kelamin || '-'}</td>
        <td>${d.tgl_lahir || '-'}</td>
        <td>${umur}</td>
        <td>${d.kategori || '-'}</td>
        <td>${d.status || '-'}</td>
      </tr>
    `;
  });

  hasil.innerHTML = html;
}

// 📊 STATS FILTERED
function updateStatsFiltered(dataList) {
  const stats = document.getElementById('stats');

  const filteredTotal = dataList.length;
  const filteredLaki = dataList.filter(d => d.kelamin === 'L').length;
  const filteredPerempuan = dataList.filter(d => d.kelamin === 'P').length;

  const total = data.length;
  const totalLaki = data.filter(d => d.kelamin === 'L').length;
  const totalPerempuan = data.filter(d => d.kelamin === 'P').length;

  const kepalaKeluargaUniqueFiltered = new Set(
    dataList.filter(d => d.status.toLowerCase() === 'kepala keluarga').map(d => d.nama.toLowerCase())
  );
  const filteredKK = kepalaKeluargaUniqueFiltered.size;

  const kepalaKeluargaUniqueTotal = new Set(
    data.filter(d => d.status.toLowerCase() === 'kepala keluarga').map(d => d.nama.toLowerCase())
  );
  const totalKK = kepalaKeluargaUniqueTotal.size;

  stats.innerHTML = `
    <div class="stat-card">👥 Total: ${filteredTotal} / ${total}</div>
    <div class="stat-card">♂️ Laki-laki: ${filteredLaki} / ${totalLaki}</div>
    <div class="stat-card">♀️ Perempuan: ${filteredPerempuan} / ${totalPerempuan}</div>
    <div class="stat-card">🏠 KK: ${filteredKK} / ${totalKK}</div>
  `;
}

// 📋 SHOW ALL
function tampilSemua() {
  renderTable(data);
}

// 🔥 HITUNG UMUR
function hitungUmur(tgl) {
  if (!tgl) return '-';
  const lahir = new Date(tgl);
  if (isNaN(lahir)) return '-';
  
  const today = new Date();
  let umur = today.getFullYear() - lahir.getFullYear();
  const m = today.getMonth() - lahir.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < lahir.getDate())) {
    umur--;
  }
  return umur;
}

// 🎨 EVENT LISTENERS
['filterKelamin', 'filterKategori'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('change', applyFilters);
});

// 🛠️ UTILITIES
function debounce(func, wait) {
  let timeout;
  return function (...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}
</script>
